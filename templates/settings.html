<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }} · Settings</title>

    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-xl px-4 py-6 sm:py-10 pb-24">
      <header class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight">Settings</h1>
        <span class="text-slate-400 text-sm">⚙️</span>
      </header>

      <section class="space-y-4">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>👶</span>
            <span>Baby Profile</span>
          </div>
          <form class="mt-4 space-y-4" method="post" action="/settings">
            <div>
              <label class="text-sm text-slate-400" for="birthdate">Birth Date</label>
              <input
                id="birthdate"
                name="birthdate"
                type="date"
                value="{{ birthdate }}"
                class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
              />
            </div>
            <button
              type="submit"
              class="w-full rounded-xl bg-cyan-500 text-slate-900 font-semibold py-3 text-lg hover:bg-cyan-400 transition"
            >
              Save
            </button>
          </form>
        </div>
      </section>

    </main>
    {% include "_nav.html" %}
  </body>
</html>

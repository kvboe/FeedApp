<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>

    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-xl px-4 py-6 sm:py-10">
      <header class="mb-6">
        <h1 class="text-3xl font-semibold tracking-tight">{{ app_name }}</h1>
        <p class="text-slate-400 mt-2">Fast logging for feeding and sleep.</p>
      </header>

      <section class="space-y-4">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <h2 class="text-lg font-semibold">Bottle Feeding</h2>
          <form
            class="mt-4 flex flex-col gap-3"
            hx-post="/feed"
            hx-target="#entries"
            hx-swap="outerHTML"
            hx-include="#notes"
          >
            <label class="text-sm text-slate-400" for="amount_ml">Amount (ml)</label>
            <input
              id="amount_ml"
              name="amount_ml"
              type="number"
              min="1"
              value="120"
              class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-cyan-500"
            />
            <button
              type="submit"
              class="rounded-xl bg-cyan-500 text-slate-900 font-semibold py-3 text-lg hover:bg-cyan-400 transition"
            >
              Log Now
            </button>
          </form>
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm" id="sleep-status">
          {% include "_sleep_status.html" %}
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <h2 class="text-lg font-semibold">Notes</h2>
          <p class="text-sm text-slate-400 mt-1">Diaper changes, medicine, or anything else.</p>
          <textarea
            id="notes"
            name="notes"
            rows="3"
            class="mt-3 w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500"
            placeholder="Optional notes..."
          ></textarea>
        </div>

        {% include "_entries.html" %}
      </section>
    </main>
  </body>
</html>

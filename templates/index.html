<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>

    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-xl px-4 py-6 sm:py-10">
      <header class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight">{{ app_name }}</h1>
        <span class="text-slate-400 text-sm">🍼🌙</span>
      </header>

      <section class="space-y-4">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>🍼</span>
            <span>Feed</span>
          </div>
          <form
            class="mt-4 flex flex-col gap-3"
            hx-post="/feed"
            hx-target="#entries"
            hx-swap="outerHTML"
            hx-include="#notes,#filters"
          >
            <label class="text-sm text-slate-400" for="amount_ml">ml</label>
            <input
              id="amount_ml"
              name="amount_ml"
              type="number"
              min="1"
              value="120"
              class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-cyan-500"
            />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-sm text-slate-400" for="minutes_ago">⏱️ min ago</label>
                <input
                  id="minutes_ago"
                  name="minutes_ago"
                  type="number"
                  min="0"
                  value="0"
                  class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
                />
              </div>
              <div>
                <label class="text-sm text-slate-400" for="created_at">🕒 time</label>
                <input
                  id="created_at"
                  name="created_at"
                  type="datetime-local"
                  class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
                />
              </div>
            </div>
            <button
              type="submit"
              class="rounded-xl bg-cyan-500 text-slate-900 font-semibold py-3 text-lg hover:bg-cyan-400 transition"
            >
              Log
            </button>
          </form>
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm" id="sleep-status">
          {% include "_sleep_status.html" %}
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>📝</span>
            <span>Notes</span>
          </div>
          <textarea
            id="notes"
            name="notes"
            rows="3"
            class="mt-3 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
            placeholder="Optional notes..."
          ></textarea>
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>📅</span>
            <span>Filter</span>
          </div>
          <form
            id="filters"
            class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3"
            hx-get="/entries"
            hx-target="#entries"
            hx-swap="outerHTML"
          >
            <div>
              <label class="text-sm text-slate-400" for="start_date">From</label>
              <input
                id="start_date"
                name="start_date"
                type="date"
                value="{{ start_date }}"
                class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
            </div>
            <div>
              <label class="text-sm text-slate-400" for="end_date">To</label>
              <input
                id="end_date"
                name="end_date"
                type="date"
                value="{{ end_date }}"
                class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
              />
            </div>
            <div class="sm:col-span-2 flex justify-end">
              <button
                type="submit"
                class="rounded-lg bg-slate-800 text-slate-100 text-xs font-semibold px-3 py-2 hover:bg-slate-700"
              >
                Apply
              </button>
            </div>
          </form>
        </div>

        {% include "_entries.html" %}
      </section>
    </main>
  </body>
</html>

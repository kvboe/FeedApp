<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>

    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-xl px-4 py-6 sm:py-10 pb-24">
      <header class="mb-4 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">{{ app_name }}</h1>
          {% if age_days is not none %}
          <p class="text-sm text-slate-400">Day {{ age_days }}</p>
          {% endif %}
        </div>
        <span class="text-slate-400 text-sm">🍼🌙</span>
      </header>

      <section class="space-y-4">
        {% include "_stats.html" %}

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>🍼</span>
            <span>Feed</span>
          </div>
          <form
            class="mt-4 flex flex-col gap-3"
            hx-post="/feed"
            hx-target="#stats"
            hx-swap="outerHTML"
            hx-include="#feed-notes"
          >
            <input type="hidden" name="timezone_offset" class="timezone-offset-input" value="{{ timezone_offset }}">
            <div class="grid grid-cols-2 bg-slate-800 p-1 rounded-xl">
              <label class="cursor-pointer">
                <input type="radio" name="subtype" value="formula" class="peer sr-only" {% if stats.last_feed and stats.last_feed['subtype'] == 'formula' %}checked{% endif %}>
                <div class="rounded-lg py-2 text-center text-sm font-medium text-slate-400 peer-checked:bg-cyan-500 peer-checked:text-slate-900 transition-all">
                  Formula
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="subtype" value="breast_milk" class="peer sr-only" {% if not stats.last_feed or stats.last_feed['subtype'] != 'formula' %}checked{% endif %}>
                <div class="rounded-lg py-2 text-center text-sm font-medium text-slate-400 peer-checked:bg-pink-500 peer-checked:text-white transition-all">
                  Mother's
                </div>
              </label>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-sm text-slate-400" for="amount_ml">ml</label>
                <input
                  id="amount_ml"
                  name="amount_ml"
                  type="number"
                  min="1"
                  value="{{ stats.last_feed.amount_ml if stats.last_feed else 120 }}"
                  class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
                />
              </div>
              <div>
                <label class="text-sm text-slate-400" for="minutes_ago">⏱️ min ago</label>
                <input
                  id="minutes_ago"
                  name="minutes_ago"
                  type="number"
                  min="0"
                  value="0"
                  class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
                />
              </div>
            </div>
            <input
              id="feed-notes"
              name="notes"
              type="text"
              placeholder="📝 Notes"
              class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
            />
            <button
              type="submit"
              class="rounded-xl bg-cyan-500 text-slate-900 font-semibold py-3 text-lg hover:bg-cyan-400 transition"
            >
              Log
            </button>
          </form>
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm" id="sleep-status">
          {% include "_sleep_status.html" %}
        </div>

                <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold mb-2">
            <span>📈</span>
            <span>Week</span>
          </div>
          <div class="h-40">
            <canvas id="feedChart"></canvas>
          </div>
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              const ctx = document.getElementById('feedChart').getContext('2d');
              new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: [{% for l in chart_data.labels %}"{{ l }}",{% endfor %}],
                  datasets: [{
                    label: 'Volume (ml)',
                    data: [{% for d in chart_data.data %}{{ d }},{% endfor %}],
                    backgroundColor: '#06b6d4',
                    borderRadius: 4,
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
                  }
                }
              });
            });
          </script>
        </div>

        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>⚖️</span>
            <span>Weight</span>
          </div>
          <form
            class="mt-4 flex flex-col gap-3"
            hx-post="/weight"
            hx-swap="none"
          >
            <input type="hidden" name="timezone_offset" class="timezone-offset-input" value="{{ timezone_offset }}">
            <div>
              <label class="text-sm text-slate-400" for="weight_g">grams</label>
              <div class="flex gap-2">
                <input
                  id="weight_g"
                  name="weight_g"
                  type="number"
                  min="1"
                  placeholder="3500"
                  class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
                />
                <button
                  type="submit"
                  class="mt-1 rounded-xl bg-slate-800 border border-slate-700 px-4 font-semibold hover:bg-slate-700 transition"
                >
                  Save
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
    {% include "_nav.html" %}

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4">
      <div class="bg-slate-800 text-slate-100 px-4 py-2 rounded-full shadow-lg border border-slate-700 flex items-center gap-2 text-sm font-medium">
        <span id="toast-icon">✅</span>
        <span id="toast-message">Logged</span>
      </div>
    </div>

    <script>
      document.body.addEventListener("showToast", function(evt){
        const toast = document.getElementById("toast");
        const msg = document.getElementById("toast-message");
        const detail = evt.detail;
        if (detail && detail.value) {
           msg.innerText = detail.value;
        } else if (typeof detail === 'string') {
           msg.innerText = detail;
        } else {
           msg.innerText = "Logged!";
        }

        toast.classList.remove("opacity-0", "-translate-y-4");
        setTimeout(() => {
          toast.classList.add("opacity-0", "-translate-y-4");
        }, 2000);
      });

      // Set timezone offset for all such inputs
      function setTimezoneOffsets() {
         const offset = new Date().getTimezoneOffset();
         // Set cookie for server-side rendering
         document.cookie = "timezone_offset=" + offset + "; path=/; max-age=31536000";

         document.querySelectorAll('.timezone-offset-input').forEach(el => {
            el.value = offset;
         });
      }

      // Run on load
      setTimezoneOffsets();

      // Run on HTMX content load (when edit forms etc are injected)
      document.body.addEventListener('htmx:load', function(evt) {
        setTimezoneOffsets();
      });
    </script>
  </body>
</html>

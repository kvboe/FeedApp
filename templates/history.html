<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }} · History</title>

    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-xl px-4 py-6 sm:py-10 pb-24">
      <header class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight">History</h1>
        <span class="text-slate-400 text-sm">🗂️</span>
      </header>

      <section class="space-y-4">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-sm">
          <div class="flex items-center gap-2 text-lg font-semibold">
            <span>📅</span>
            <span>Filter</span>
          </div>
          <script>
            function setFilter(type) {
              const form = document.getElementById('filters');
              const input = document.getElementById('event_type');
              if (type === 'today') {
                  const today = new Date().toISOString().split('T')[0];
                  document.getElementById('start_date').value = today;
                  document.getElementById('end_date').value = today;
                  // reset type
                  input.value = '';
              } else {
                  // toggle or set type
                  if (input.value === type) {
                      input.value = ''; // toggle off
                  } else {
                      input.value = type;
                  }
                  // clear dates if we just want to see all feeds/sleeps?
                  // or keep them? Keep them is usually better UX.
              }
              htmx.trigger(form, 'submit');
            }
          </script>
          <div class="mt-4 flex gap-2 overflow-x-auto pb-2 no-scrollbar">
            <button
              type="button"
              onclick="setFilter('today')"
              class="whitespace-nowrap rounded-full bg-slate-800 border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition"
            >
              📅 Today
            </button>
            <button
              type="button"
              onclick="setFilter('feed')"
              class="whitespace-nowrap rounded-full bg-slate-800 border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition"
            >
              🍼 Feed
            </button>
            <button
              type="button"
              onclick="setFilter('sleep')"
              class="whitespace-nowrap rounded-full bg-slate-800 border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition"
            >
              🌙 Sleep
            </button>
          </div>

          <form
            id="filters"
            class="mt-3 grid grid-cols-2 gap-3"
            hx-get="/entries"
            hx-target="#entries"
            hx-swap="outerHTML"
          >
            <input type="hidden" name="type" id="event_type" value="{{ event_type }}">
            <div>
              <label class="text-sm text-slate-400" for="start_date">From</label>
              <input
                id="start_date"
                name="start_date"
                type="date"
                value="{{ start_date }}"
                class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
              />
            </div>
            <div>
              <label class="text-sm text-slate-400" for="end_date">To</label>
              <input
                id="end_date"
                name="end_date"
                type="date"
                value="{{ end_date }}"
                class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none"
              />
            </div>
            <div class="sm:col-span-2 flex justify-end">
              <button
                type="submit"
                class="rounded-lg bg-slate-800 text-slate-100 text-xs font-semibold px-3 py-2 hover:bg-slate-700"
              >
                Apply
              </button>
            </div>
          </form>
        </div>

        {% include "_entries.html" %}
      </section>
    </main>
    {% include "_nav.html" %}
  </body>
</html>

<div class="flex items-center justify-between gap-3">
  <div>
    <div class="flex items-center gap-2 text-lg font-semibold">
      <span>🌙</span>
      <span>Sleep</span>
    </div>
    {% if sleep_state.active %}
      <p class="text-sm text-emerald-400 mt-1">Since {{ format_datetime(sleep_state.started_at) }}</p>
    {% else %}
      <p class="text-sm text-slate-400 mt-1">Idle</p>
    {% endif %}
  </div>
  <form
    hx-post="/sleep/toggle"
    hx-target="#sleep-status"
    hx-swap="outerHTML"
    hx-include="#sleep-notes"
  >
    {% if sleep_state.active %}
      <button
        type="submit"
        class="rounded-xl bg-emerald-400 text-slate-900 font-semibold px-6 py-3 text-lg hover:bg-emerald-300 transition"
      >
        Stop
      </button>
    {% else %}
      <button
        type="submit"
        class="rounded-xl bg-indigo-400 text-slate-900 font-semibold px-6 py-3 text-lg hover:bg-indigo-300 transition"
      >
        Start
      </button>
    {% endif %}
  </form>
</div>
<input
  id="sleep-notes"
  name="notes"
  type="text"
  placeholder="📝 Notes"
  class="mt-3 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
 />

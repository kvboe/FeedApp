<div class="flex items-center justify-between gap-3">
  <div>
    <h2 class="text-lg font-semibold">Sleep Tracking</h2>
    {% if sleep_state.active %}
      <p class="text-sm text-emerald-400 mt-1">Sleeping since {{ format_datetime(sleep_state.started_at) }}</p>
    {% else %}
      <p class="text-sm text-slate-400 mt-1">Not sleeping</p>
    {% endif %}
  </div>
  <form
    hx-post="/sleep/toggle"
    hx-swap="none"
    hx-include="#notes,#filters"
  >
    {% if sleep_state.active %}
      <button
        type="submit"
        class="rounded-xl bg-emerald-400 text-slate-900 font-semibold px-6 py-3 text-lg hover:bg-emerald-300 transition"
      >
        Stop
      </button>
    {% else %}
      <button
        type="submit"
        class="rounded-xl bg-indigo-400 text-slate-900 font-semibold px-6 py-3 text-lg hover:bg-indigo-300 transition"
      >
        Start
      </button>
    {% endif %}
  </form>
</div>

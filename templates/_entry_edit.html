<div id="entry-{{ entry.id }}" class="rounded-xl border border-slate-700 bg-slate-900 p-3">
  <form
    class="space-y-3"
    hx-post="/entries/{{ entry.id }}"
    hx-target="#entry-{{ entry.id }}"
    hx-swap="outerHTML"
  >
    <div class="flex items-center justify-between">
      <span class="text-sm uppercase tracking-wide text-slate-400">✏️ Edit</span>
    </div>

    {% if entry.type == 'feed' %}
      <div>
        <label class="text-sm text-slate-400" for="amount_ml_{{ entry.id }}">Amount (ml)</label>
        <input
          id="amount_ml_{{ entry.id }}"
          name="amount_ml"
          type="number"
          min="1"
          value="{{ entry.amount_ml }}"
          class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
        />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-sm text-slate-400" for="created_date_{{ entry.id }}">Date</label>
          <input
            id="created_date_{{ entry.id }}"
            name="created_date"
            type="date"
            value="{{ format_date_input(entry.created_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-400" for="created_time_{{ entry.id }}">Time</label>
          <input
            id="created_time_{{ entry.id }}"
            name="created_time"
            type="time"
            value="{{ format_time_input(entry.created_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
      </div>
    {% else %}
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-sm text-slate-400" for="started_date_{{ entry.id }}">Start date</label>
          <input
            id="started_date_{{ entry.id }}"
            name="started_date"
            type="date"
            value="{{ format_date_input(entry.started_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-400" for="started_time_{{ entry.id }}">Start time</label>
          <input
            id="started_time_{{ entry.id }}"
            name="started_time"
            type="time"
            value="{{ format_time_input(entry.started_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-sm text-slate-400" for="ended_date_{{ entry.id }}">End date</label>
          <input
            id="ended_date_{{ entry.id }}"
            name="ended_date"
            type="date"
            value="{{ format_date_input(entry.ended_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-400" for="ended_time_{{ entry.id }}">End time</label>
          <input
            id="ended_time_{{ entry.id }}"
            name="ended_time"
            type="time"
            value="{{ format_time_input(entry.ended_at) }}"
            class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-base appearance-none"
          />
        </div>
       </div>
    {% endif %}

    <div>
      <label class="text-sm text-slate-400" for="notes_{{ entry.id }}">Notes</label>
      <textarea
        id="notes_{{ entry.id }}"
        name="notes"
        rows="2"
        class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2"
      >{{ entry.notes or '' }}</textarea>
    </div>

    <div class="flex items-center justify-between">
      <button
        type="button"
        class="text-xs text-red-500 hover:text-red-400 font-medium px-2 py-1"
        hx-delete="/entries/{{ entry.id }}"
        hx-target="#entry-{{ entry.id }}"
        hx-swap="outerHTML"
        hx-confirm="Are you sure you want to delete this record?"
      >
        🗑️ Delete
      </button>

      <div class="flex items-center gap-3">
        <button
          type="button"
          class="text-xs text-slate-300 hover:text-white"
          hx-get="/entries"
          hx-target="#entries"
          hx-swap="outerHTML"
          hx-include="#filters"
          aria-label="Cancel"
          title="Cancel"
        >
          ✕
        </button>
        <button
          type="submit"
          class="rounded-lg bg-cyan-500 text-slate-900 text-xs font-semibold px-3 py-2 hover:bg-cyan-400"
        >
          ✓
        </button>
      </div>
    </div>
  </form>
</div>
